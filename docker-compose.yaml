services:
  # Base de dados (Persistência)
  db:
    image: postgres:15
    container_name: kicksdrop-db
    env_file: .env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data # Onde os dados dos ténis ficam salvos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache e Filas (Resiliência para os Drops)
  redis:
    image: redis:alpine
    container_name: kicksdrop-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # Backend (O Medusa)
  medusa:
    build: .
    container_name: kicksdrop-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "9000:9000"
      - "7001:7001"