apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-admin
  namespace: pisofire
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        job: bootstrap-admin
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-medusa
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -qO- http://medusa:9000/readyz; do
                echo "Waiting for Medusa readiness endpoint..."
                sleep 5
              done
      containers:
        - name: bootstrap-admin
          image: my-medusa-store-medusa:latest
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - sh
            - -c
            - |
              set -eu

              if [ -z "${MEDUSA_ADMIN_EMAIL:-}" ] || [ -z "${MEDUSA_ADMIN_PASSWORD:-}" ]; then
                echo "MEDUSA_ADMIN_EMAIL and MEDUSA_ADMIN_PASSWORD must be set." >&2
                exit 1
              fi

              set +e
              OUTPUT="$(npx medusa user -e "$MEDUSA_ADMIN_EMAIL" -p "$MEDUSA_ADMIN_PASSWORD" 2>&1)"
              STATUS=$?
              set -e

              printf '%s\n' "$OUTPUT"

              if [ "$STATUS" -eq 0 ]; then
                echo "Admin user created: $MEDUSA_ADMIN_EMAIL"
                exit 0
              fi

              if printf '%s\n' "$OUTPUT" | grep -qi "already exists"; then
                echo "Admin user already exists: $MEDUSA_ADMIN_EMAIL"
                exit 0
              fi

              exit "$STATUS"
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: REDIS_URL
            - name: STORE_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: STORE_CORS
            - name: ADMIN_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: ADMIN_CORS
            - name: AUTH_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: AUTH_CORS
            - name: MEDUSA_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: MEDUSA_ADMIN_EMAIL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: COOKIE_SECRET
            - name: MEDUSA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: MEDUSA_ADMIN_PASSWORD
