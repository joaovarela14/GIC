apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: pisofire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      annotations:
        prometheus.io/path: /api/metrics
        prometheus.io/port: "8000"
        prometheus.io/scrape: "true"
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: my-medusa-store-storefront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MEDUSA_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: MEDUSA_BACKEND_URL
            - name: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
            - name: NEXT_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: NEXT_PUBLIC_BASE_URL
            - name: NEXT_PUBLIC_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: NEXT_PUBLIC_DEFAULT_REGION
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: COOKIE_SECURE
            - name: REVALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: REVALIDATE_SECRET
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: pisofire
  labels:
    app: storefront
  annotations:
    prometheus.io/path: /api/metrics
    prometheus.io/port: "8000"
    prometheus.io/scrape: "true"
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 8000
      targetPort: 8000
