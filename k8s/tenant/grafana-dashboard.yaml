apiVersion: v1
kind: ConfigMap
metadata:
  name: pisofire-grafana-dashboard
  namespace: tenant-pisofire
  labels:
    grafana_dashboard: "1"
data:
  pisofire-dashboard.json: |
    {
      "title": "PisoFire - Observability",
      "uid": "pisofire-main",
      "tags": ["pisofire"],
      "timezone": "browser",
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(medusa_http_requests_total{tenant=\"pisofire\"}[1m])) by (route)",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "100 * sum(rate(medusa_http_requests_total{tenant=\"pisofire\", status=~\"5..\"}[1m])) / sum(rate(medusa_http_requests_total{tenant=\"pisofire\"}[1m]))",
              "legendFormat": "error rate %"
            }
          ]
        },
        {
          "id": 3,
          "title": "HTTP Latency Percentiles (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(medusa_http_request_duration_seconds_bucket{tenant=\"pisofire\"}[1m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(medusa_http_request_duration_seconds_bucket{tenant=\"pisofire\"}[1m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(medusa_http_request_duration_seconds_bucket{tenant=\"pisofire\"}[1m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Node.js Memory Usage (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "nodejs_heap_size_used_bytes{tenant=\"pisofire\"}",
              "legendFormat": "heap used"
            },
            {
              "expr": "nodejs_heap_size_total_bytes{tenant=\"pisofire\"}",
              "legendFormat": "heap total"
            }
          ]
        },
        {
          "id": 5,
          "title": "PostgreSQL Active Connections",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pg_stat_activity_count{namespace=\"tenant-pisofire\"}",
              "legendFormat": "connections"
            }
          ]
        },
        {
          "id": 6,
          "title": "Redis Connected Clients",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "redis_connected_clients{namespace=\"tenant-pisofire\"}",
              "legendFormat": "clients"
            }
          ]
        },
        {
          "id": 7,
          "title": "Redis Memory Used (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "redis_memory_used_bytes{namespace=\"tenant-pisofire\"}",
              "legendFormat": "memory used"
            }
          ]
        },
        {
          "id": 8,
          "title": "PostgreSQL DB Size (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pg_database_size_bytes{namespace=\"tenant-pisofire\"}",
              "legendFormat": "{{datname}}"
            }
          ]
        }
      ],
      "schemaVersion": 36
    }
