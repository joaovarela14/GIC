apiVersion: v1
kind: ConfigMap
metadata:
  name: pisofire-grafana-dashboard-infra
  namespace: tenant-pisofire
  labels:
    grafana_dashboard: "1"
data:
  pisofire-infra.json: |
    {
      "title": "PisoFire - Infrastructure",
      "uid": "pisofire-infra",
      "tags": ["pisofire"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 20,
          "title": "Pods Running",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 3 }, { "color": "green", "value": 5 }] } } },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"tenant-pisofire\", phase=\"Running\"} == 1)", "legendFormat": "" }]
        },
        {
          "id": 21,
          "title": "Pod Restarts (1h)",
          "type": "stat",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 3 }, { "color": "red", "value": 10 }] } } },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"tenant-pisofire\"}[1h]))", "legendFormat": "" }]
        },
        {
          "id": 22,
          "title": "Medusa Replicas",
          "type": "stat",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } },
          "targets": [{ "expr": "kube_deployment_status_replicas_ready{namespace=\"tenant-pisofire\", deployment=\"medusa\"}", "legendFormat": "" }]
        },
        {
          "id": 23,
          "title": "Storefront Replicas",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } },
          "targets": [{ "expr": "kube_deployment_status_replicas_ready{namespace=\"tenant-pisofire\", deployment=\"storefront\"}", "legendFormat": "" }]
        },
        {
          "id": 24,
          "title": "Last Backup",
          "type": "stat",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 90000 }, { "color": "red", "value": 172800 }] } } },
          "targets": [{ "expr": "time() - kube_cronjob_status_last_successful_time{namespace=\"tenant-pisofire\", cronjob=\"postgres-backup\"}", "legendFormat": "" }]
        },
        {
          "id": 1,
          "title": "Ready Pods per Workload",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"tenant-pisofire\"}",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod Restarts Over Time",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"tenant-pisofire\", container!=\"\"}[5m])",
              "legendFormat": "{{container}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "CPU Usage per Pod (cores)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"tenant-pisofire\", container!=\"\"}[2m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Memory Usage per Pod (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"tenant-pisofire\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "PVC Disk Usage (%)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=\"tenant-pisofire\"} / kubelet_volume_stats_capacity_bytes{namespace=\"tenant-pisofire\"}",
              "legendFormat": "{{persistentvolumeclaim}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "PVC Disk Used / Capacity (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"tenant-pisofire\"}",
              "legendFormat": "used: {{persistentvolumeclaim}}"
            },
            {
              "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"tenant-pisofire\"}",
              "legendFormat": "capacity: {{persistentvolumeclaim}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "PostgreSQL Active Connections",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "pg_stat_database_numbackends{namespace=\"tenant-pisofire\", datname=\"medusa-store\"}",
              "legendFormat": "connections"
            }
          ]
        },
        {
          "id": 8,
          "title": "PostgreSQL DB Size (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "pg_database_size_bytes{namespace=\"tenant-pisofire\", datname=\"medusa-store\"}",
              "legendFormat": "medusa-store"
            }
          ]
        },
        {
          "id": 9,
          "title": "Redis Memory Used (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "redis_memory_used_bytes{namespace=\"tenant-pisofire\"}",
              "legendFormat": "used"
            }
          ]
        },
        {
          "id": 10,
          "title": "Medusa Node.js Heap (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(pisofire_medusa_nodejs_heap_size_used_bytes)",
              "legendFormat": "heap used"
            },
            {
              "expr": "sum(pisofire_medusa_nodejs_heap_size_total_bytes)",
              "legendFormat": "heap total"
            }
          ]
        },
        {
          "id": 11,
          "title": "Medusa Event Loop Lag (seconds)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pisofire_medusa_nodejs_eventloop_lag_seconds",
              "legendFormat": "event loop lag"
            }
          ]
        }
      ],
      "schemaVersion": 36
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pisofire-grafana-dashboard-svc
  namespace: tenant-pisofire
  labels:
    grafana_dashboard: "1"
data:
  pisofire-service.json: |
    {
      "title": "PisoFire - Service Health",
      "uid": "pisofire-svc",
      "tags": ["pisofire"],
      "timezone": "browser",
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 14,
          "title": "Storefront",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] }, "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }] } },
          "targets": [{ "expr": "max(probe_success{endpoint=\"storefront\"})", "legendFormat": "storefront" }]
        },
        {
          "id": 15,
          "title": "Medusa",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] }, "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }] } },
          "targets": [{ "expr": "max(probe_success{endpoint=\"medusa\"})", "legendFormat": "medusa" }]
        },
        {
          "id": 22,
          "title": "PostgreSQL",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] }, "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }] } },
          "targets": [{ "expr": "pg_up{namespace=\"tenant-pisofire\"}", "legendFormat": "" }]
        },
        {
          "id": 23,
          "title": "Redis",
          "type": "stat",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] }, "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }] } },
          "targets": [{ "expr": "redis_up{namespace=\"tenant-pisofire\"}", "legendFormat": "" }]
        },
        {
          "id": 25,
          "title": "Alertmanager",
          "type": "stat",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] }, "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }] } },
          "targets": [{ "expr": "max(up{job=\"prometheus-kube-prometheus-alertmanager\"})", "legendFormat": "" }]
        },
        {
          "id": 13,
          "title": "p99 Latency",
          "type": "stat",
          "gridPos": { "x": 0, "y": 4, "w": 8, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "ms", "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 1000 }] } } },
          "targets": [{ "expr": "1000 * histogram_quantile(0.99, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99" }]
        },
        {
          "id": 18,
          "title": "Availability SLO (5m)",
          "type": "stat",
          "gridPos": { "x": 8, "y": 4, "w": 8, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 95 }, { "color": "green", "value": 99.5 }] } } },
          "targets": [{ "expr": "avg(avg_over_time(probe_success{tenant=\"pisofire\"}[5m])) * 100", "legendFormat": "availability" }]
        },
        {
          "id": 3,
          "title": "Request Rate — Store API (req/min)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/.*\"}[2m])) by (route) * 60", "legendFormat": "{{route}}" }]
        },
        {
          "id": 4,
          "title": "Error Rate — Store API (%)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "100 * sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/.*\", status_code=~\"5..\"}[2m])) by (route) / sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/.*\"}[2m])) by (route) or sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/.*\"}[2m])) by (route) * 0",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Latency p50 / p95 / p99 (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket[2m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket[2m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket[2m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 6,
          "title": "Checkout Path — Request Rate (req/min)",
          "description": "Critical user journey: product page → cart → payment",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/products.*\"}[1m])) * 60", "legendFormat": "product page" },
            { "expr": "sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/carts.*\"}[1m])) * 60", "legendFormat": "cart" },
            { "expr": "sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/payment.*\"}[1m])) * 60", "legendFormat": "payment" },
            { "expr": "sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/orders.*\"}[1m])) * 60", "legendFormat": "orders" }
          ]
        },
        {
          "id": 7,
          "title": "Checkout Path — Error Rate (%)",
          "description": "5xx errors on the buying path",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [
            { "expr": "100 * sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/carts.*\", status_code=~\"5..\"}[1m])) / sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/carts.*\"}[1m])) or sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/carts.*\"}[1m])) * 0", "legendFormat": "cart errors %" },
            { "expr": "100 * sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/payment.*\", status_code=~\"5..\"}[1m])) / sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/payment.*\"}[1m])) or sum(rate(pisofire_medusa_http_requests_total{route=~\"/store/payment.*\"}[1m])) * 0", "legendFormat": "payment errors %" }
          ]
        },
        {
          "id": 8,
          "title": "Checkout Path — Latency p99 (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 32, "w": 24, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket{route=~\"/store/products.*\"}[2m])) by (le))", "legendFormat": "product p99" },
            { "expr": "histogram_quantile(0.99, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket{route=~\"/store/carts.*\"}[2m])) by (le))", "legendFormat": "cart p99" },
            { "expr": "histogram_quantile(0.99, sum(rate(pisofire_medusa_http_request_duration_seconds_bucket{route=~\"/store/payment.*\"}[2m])) by (le))", "legendFormat": "payment p99" }
          ]
        },
        {
          "id": 10,
          "title": "Dependency Health (database & redis)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 40, "w": 24, "h": 8 },
          "targets": [{ "expr": "pisofire_medusa_dependency_up", "legendFormat": "{{dependency}}" }]
        }
      ],
      "schemaVersion": 36
    }
