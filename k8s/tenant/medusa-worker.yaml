apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-worker
  namespace: pisofire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-worker
  template:
    metadata:
      labels:
        app: medusa-worker
    spec:
      initContainers:
        - name: wait-for-medusa
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -qO- http://medusa:9000/health; do
                echo "Waiting for Medusa health endpoint..."
                sleep 5
              done
      containers:
        - name: medusa-worker
          image: my-medusa-store-medusa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: REDIS_URL
            - name: STORE_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: STORE_CORS
            - name: ADMIN_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: ADMIN_CORS
            - name: AUTH_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: AUTH_CORS
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: COOKIE_SECURE
            - name: COOKIE_SAME_SITE
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: COOKIE_SAME_SITE
            - name: MEDUSA_RUN_MIGRATIONS
              value: "false"
            - name: MEDUSA_RUN_SEED
              value: "false"
            - name: MEDUSA_WORKER_MODE
              value: worker
            - name: DISABLE_MEDUSA_ADMIN
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: COOKIE_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
