apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medusa-worker
  namespace: pisofire
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medusa-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
