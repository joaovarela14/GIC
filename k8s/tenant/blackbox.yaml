apiVersion: v1
kind: ConfigMap
metadata:
  name: pisofire-blackbox-config
  namespace: tenant-pisofire
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 307]
          follow_redirects: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: tenant-pisofire
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          args:
            - --config.file=/config/config.yml
          ports:
            - containerPort: 9115
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: pisofire-blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: tenant-pisofire
  labels:
    app: blackbox-exporter
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: pisofire-probes
  namespace: tenant-pisofire
  labels:
    release: prometheus
spec:
  prober:
    url: blackbox-exporter.tenant-pisofire.svc.cluster.local:9115
    path: /probe
  module: http_2xx
  targets:
    staticConfig:
      static:
        - http://storefront.tenant-pisofire.svc.cluster.local:8000/api/health
        - http://medusa.tenant-pisofire.svc.cluster.local:9000/health
        - http://medusa.tenant-pisofire.svc.cluster.local:9000/readyz
        - http://medusa.tenant-pisofire.svc.cluster.local:9000/store-readyz
      labels:
        tenant: pisofire
  # Attach a friendly `endpoint` label to each probe sample so dashboards
  # can query `probe_success{endpoint="storefront"}` instead of pinning to
  # the full target URL via the `instance` label.
  metricRelabelings:
    - sourceLabels: [instance]
      regex: 'http://storefront\..*/api/health'
      targetLabel: endpoint
      replacement: storefront
    - sourceLabels: [instance]
      regex: 'http://medusa\..*/health'
      targetLabel: endpoint
      replacement: medusa
    - sourceLabels: [instance]
      regex: 'http://medusa\..*/readyz'
      targetLabel: endpoint
      replacement: medusa-readyz
    - sourceLabels: [instance]
      regex: 'http://medusa\..*/store-readyz'
      targetLabel: endpoint
      replacement: medusa-store-readyz
