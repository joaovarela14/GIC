apiVersion: v1
kind: ConfigMap
metadata:
  name: pisofire-config
  namespace: pisofire
data:
  POSTGRES_DB: medusa-store
  POSTGRES_USER: postgres
  REDIS_URL: redis://redis-sentinel:26379
  CACHE_REDIS_URL: redis://redis-sentinel:26379
  EVENTS_REDIS_URL: redis://redis-sentinel:26379
  WE_REDIS_URL: redis://redis-sentinel:26379
  LOCKING_REDIS_URL: redis://redis-sentinel:26379
  REDIS_SENTINEL_NAME: pisofire-redis
  REDIS_SENTINEL_HOSTS: redis-0.redis-headless.tenant-pisofire.svc.cluster.local:26379,redis-1.redis-headless.tenant-pisofire.svc.cluster.local:26379,redis-2.redis-headless.tenant-pisofire.svc.cluster.local:26379
  STORE_CORS: http://pisofire.deti,http://localhost:8000
  ADMIN_CORS: http://medusa-pisofire.deti,http://localhost:9000,http://localhost:5173
  AUTH_CORS: http://medusa-pisofire.deti,http://localhost:9000,http://localhost:5173
  COOKIE_SECURE: "false"
  COOKIE_SAME_SITE: lax
  NODE_ENV: production
  MEDUSA_RUN_SEED: "false"
  MEDUSA_BACKEND_URL: http://medusa:9000
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ""
  NEXT_PUBLIC_BASE_URL: http://pisofire.deti
  NEXT_PUBLIC_DEFAULT_REGION: pt
  S3_ENDPOINT: http://minio:9000
  S3_FILE_URL: http://minio-pisofire.deti/medusa-media
  S3_REGION: us-east-1
  S3_BUCKET: medusa-media
