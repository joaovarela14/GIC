apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: tenant-pisofire
spec:
  rules:
    - host: pisofire.deti
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medusa
  namespace: tenant-pisofire
spec:
  rules:
    - host: medusa-pisofire.deti
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medusa
                port:
                  number: 9000
