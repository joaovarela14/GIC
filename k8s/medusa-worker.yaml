apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-worker
  namespace: pisofire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-worker
  template:
    metadata:
      labels:
        app: medusa-worker
    spec:
      containers:
        - name: medusa-worker
          image: my-medusa-store-medusa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: REDIS_URL
            - name: STORE_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: STORE_CORS
            - name: ADMIN_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: ADMIN_CORS
            - name: AUTH_CORS
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: AUTH_CORS
            - name: MEDUSA_RUN_MIGRATIONS
              value: "false"
            - name: MEDUSA_RUN_SEED
              value: "false"
            - name: MEDUSA_WORKER_MODE
              value: worker
            - name: DISABLE_MEDUSA_ADMIN
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: COOKIE_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
