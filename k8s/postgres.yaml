apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pisofire
spec:
  serviceName: postgres-headless
  replicas: 2
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: pisofire-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pisofire-secrets
                  key: POSTGRES_REPLICATION_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          command:
            - sh
            - -ec
            - |
              ordinal="${HOSTNAME##*-}"

              if [ "$ordinal" = "0" ]; then
                mkdir -p /docker-entrypoint-initdb.d
                cat > /docker-entrypoint-initdb.d/10-replication-user.sh <<'EOF'
              #!/bin/sh
              set -eu
              echo "host replication replicator all scram-sha-256" >> "$PGDATA/pg_hba.conf"
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'replicator') THEN
                  CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '${POSTGRES_REPLICATION_PASSWORD}';
                END IF;
              END
              \$\$;
              SQL
              EOF
                chmod +x /docker-entrypoint-initdb.d/10-replication-user.sh

                exec docker-entrypoint.sh postgres \
                  -c listen_addresses='*' \
                  -c wal_level=replica \
                  -c max_wal_senders=10 \
                  -c max_replication_slots=10 \
                  -c hot_standby=on
              fi

              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                rm -rf "$PGDATA"/*
                until PGPASSWORD="$POSTGRES_REPLICATION_PASSWORD" pg_basebackup \
                  -h postgres-0.postgres-headless \
                  -D "$PGDATA" \
                  -U replicator \
                  -Fp \
                  -Xs \
                  -P \
                  -R; do
                  echo "Waiting for primary Postgres to accept replication connections..."
                  sleep 5
                done
                chown -R postgres:postgres "$PGDATA"
                chmod 700 "$PGDATA"
              fi

              exec docker-entrypoint.sh postgres \
                -c listen_addresses='*' \
                -c hot_standby=on
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: pisofire
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pisofire
spec:
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: pisofire
spec:
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-1
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
